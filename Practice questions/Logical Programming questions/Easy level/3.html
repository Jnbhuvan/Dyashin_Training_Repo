  <body>
    <h1>Find largest number from an array</h1>
    <h3>Easy level logical questions</h3>
    <h3>by BHUVAN JN</h3>
    <script>
      function findMaxValueArr(arr) {
        return Math.max(...arr);
      }
      console.log(findMaxValueArr([10, 20, 3, 4, 5, 6, 11, 99]));
    </script>
