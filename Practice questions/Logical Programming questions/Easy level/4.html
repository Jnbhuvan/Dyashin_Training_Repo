<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Return Arr sum</title>
  </head>
  <body>
    <h1>Return Array sum</h1>
    <h3>Easy level logical questions</h3>
    <h3>by BHUVAN JN</h3>
    <script>
      function findSum(arr) {
        let sum = 0;
        arr.map((a) => {
          sum += a;
        });
        return sum;
      }
      console.log(findSum([1, 2, 3, 4, 5]));
    </script>
  </body>
</html>
