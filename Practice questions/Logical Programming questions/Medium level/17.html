<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group object based on properties</title>
  </head>
  <body>
    <h1>Group object based on properties</h1>
    <h3>Medium level logical questions</h3>
    <h3>by BHUVAN JN</h3>
    <script>
      function groupobj(arrObj) {
        let result = {};
        for (let obj of arrObj) {
          if (!result[obj.department]) {
            result[obj.department] = [];
          }
          result[obj.department].push(obj);
        }
        return result;
      }

      console.log(
        groupobj([
          { name: "A", department: "IT" },
          { name: "B", department: "HR" },
          { name: "C", department: "IT" },
        ]),
      );

      // console.log(groupobj);
    </script>
  </body>
</html>
