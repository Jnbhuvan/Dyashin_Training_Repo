<html lang="en">

    <meta charset="UTF-8" />

    <title>Implement a trottle function</title>
  </head>
  <body>
    <h1>Implement a trottle function</h1>
    <h2>Medium level logical questions</h2>
    <h3>by BHUVAN J N</h3>
    <script>
      function throttle(fn, delay) {
        let lastCall = 0;

        return function (...args) {
          const now = Date.now();

          if (now - lastCall >= delay) {
            lastCall = now;
            fn.apply(this, args);
          }
        };
      }
      function handleScroll() {
        console.log("Scrolling...");
      }

      const throttledScroll = throttle(handleScroll, 1000);

      window.addEventListener("scroll", throttledScroll);
    </script>
  </body>
</html>
