    <title>Find First Non Repeating Character</title>
  </head>
  <body>
    <h1>Find First Non Repeating CHarater</h1>
    <h3>Medium level logical questions</h3>
    <h3>by BHUVAN JN</h3>
    <script>
      function NonRepeatingChar(str) {
        let count = {};
        for (let s of str.split("")) {
          if (count[s]) {
            count[s]++;
          } else {
            count[s] = 1;
          }
        }
        for (let s of str) {
          if (count[s] === 1) {
            return s;
          }
        }
      }
      console.log(NonRepeatingChar("asdfbhjlasdfhjkl"));
    </script>
  </body>
