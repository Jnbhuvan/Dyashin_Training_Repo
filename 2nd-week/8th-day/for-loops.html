<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For-loops</title>
  </head>
  <body>
    <p id="h1"></p>
    <script>
      var hobbies = ["sleeping", "reading", "music-production", "exercising"];

      var items = {
        itemName: "Lenovo Laptop",
        itemPrice: 60000,
        itemQuantity: 1,
      };

      for (var i of hobbies) {
        console.log(i);
        document.getElementById("h1").append(i);
        document.getElementById("h1").append("    ");
      }

      for (var i in hobbies) {
        console.log(i);
      }

      for (var i in items) {
        console.log(items[i]);
      }
    </script>
  </body>
</html>
