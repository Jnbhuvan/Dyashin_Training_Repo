<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CallBack</title>
  </head>
  <body>
    <script>
      function greet() {
        console.log("Hello world");
      }

      function Saysomething(callback) {
        console.log("This is a call backfunction!");
      }

      Saysomething(greet);
    </script>
  </body>
</html>
