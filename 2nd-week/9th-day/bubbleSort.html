<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BubbleSort</title>
  </head>
  <body>
    <script>
      let bubbleSort = (arr) => {
        console.log(arr);

        for (let i = 0; i < arr.length; i++) {
          for (let j = 0; j < arr.length - i - 1; j++) {
            if (arr[j] > arr[j + 1]) {
              let temp = arr[j];
              arr[j] = arr[j + 1];
              arr[j + 1] = temp;
            }
          }
        }
        return arr;
      };

      console.log(bubbleSort([6, 5, 4, 3, 2, 1]));
    </script>
  </body>
</html>
