<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecondLargestArrValue</title>
  </head>
  <body>
    <script>
      let secondLargestArr = (arr) => {
        console.log(arr);

        return arr.sort()[arr.length - 2];
      };
      console.log(secondLargestArr([6, 3, 4, 2, 4, 5]));
    </script>
  </body>
</html>
