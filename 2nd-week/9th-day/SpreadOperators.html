<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpreadOperators</title>
  </head>
  <body>
    <script>
      let add = (a = 10, b = 20, ...arr) => {
        let sum = 0;
        arr.forEach((x) => (sum += x));
        return sum + a + b;
      };

      console.log(add(1, 2, 3, 4, 5, 6, 7, 8, 9));
      console.log(add());
      console.log(add(1, 2));
    </script>
  </body>
</html>
