<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Let, Const, and Var</title>
  </head>
  <body>
    <script>
      console.log(a, "a");

      var a = 10;
      var a = 30;
      console.log(a, "a");

      //   console.log(b, "b");
      let b = 10;
      b = 20;
      console.log(b, "b");

      const c = 30;
      //   c = 40;
      console.log(c, "c");
    </script>
  </body>
</html>
