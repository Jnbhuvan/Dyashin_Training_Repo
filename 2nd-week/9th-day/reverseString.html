<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReverseAString</title>
  </head>
  <body>
    <script>
      let reverseAString = (strData) => {
        console.log("original data:", strData);

        return strData.split("").reverse().join("");
      };

      console.log("Reversed Data string: ", reverseAString("Bhuvi"));
    </script>
  </body>
</html>
