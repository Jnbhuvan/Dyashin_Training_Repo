<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factorial</title>
  </head>
  <body>
    <script>
      let factorial = (n) => {
        return n <= 1 ? 1 : n * factorial(n - 1);
      };
      console.log(factorial(5));
    </script>
  </body>
</html>
