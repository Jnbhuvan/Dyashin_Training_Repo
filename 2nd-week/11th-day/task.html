    <script>
      function countWordFreq(str) {
        let d = [];
        let words = {};
        for (let c of str) {
          d.push(c);
          if (Object.keys(words).includes(c)) {
            words[c] += 1;
          } else {
            words[c] = 1;
          }
        }
        for (let w in words) {
          if (words[w] == 1) {
            return w;
          }
        }
      }
      console.log(countWordFreq("swiss"));
    </script>
