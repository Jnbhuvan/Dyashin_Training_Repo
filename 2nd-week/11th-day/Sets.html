    <script>
      let newSet = new Set();

      newSet.add("Hello");
      newSet.add(" ");
      newSet.add("World");

      console.log(newSet);

      console.log(newSet.has("Hello"));
      console.log(newSet.delete("world"));
      console.log(newSet);

      console.log(newSet.size);
      console.log(newSet.clear());
      console.log(newSet);
    </script>
