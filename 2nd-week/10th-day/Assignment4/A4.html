    <script>
      function findDuplicates(str) {
        const counts = {};
        for (let char of str) {
          counts[char] = (counts[char] || 0) + 1;
        }

        const duplicates = Object.keys(counts).filter(
          (char) => counts[char] > 1,
        );
        return duplicates;
      }

      console.log(findDuplicates("programming"));
      // Output: [ 'r', 'g', 'm' ]
    </script>
