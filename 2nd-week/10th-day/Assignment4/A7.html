    <script>
      function removeDuplicateChars(str) {
        let c = [];
        for (s of str.split("")) {
          if (c.includes(s)) {
            continue;
          } else {
            c.push(s);
          }
        }
        return c.join("");
      }
      console.log(removeDuplicateChars("programming"));
    </script>
