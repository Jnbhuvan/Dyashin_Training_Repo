    <script>
      function largestWord(str) {
        let c = 0;
        let largest;
        for (s of str.split(" ")) {
          if (c <= s.length) {
            largest = s;
            c = s.length;
          }
        }
        return largest;
      }
      console.log(
        largestWord("The quick brown fox but the largest word is YouCan'tfind"),
      );
    </script>
