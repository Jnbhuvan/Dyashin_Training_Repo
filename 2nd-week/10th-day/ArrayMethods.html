      });

      let result1 = arr1.map((arr, ind) => {
        return arr + 10;
      });

      console.log(result);
      console.log(result1);

      console.log(arr1.indexOf(400));

      arr1 = [1, 2, 3, 4, 5, 6, 7];

      console.log(arr1.reduceRight((accVal, curVal) => accVal + curVal));

      let arr2 = [10, [20, 30, [40, 50, [60]]], 90];
