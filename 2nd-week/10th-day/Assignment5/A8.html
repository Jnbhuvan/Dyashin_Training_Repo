    <script>
      function secondCapitalize(arr) {
        let result = [];
        for (let a of arr) {
          result.push(a[0] + a[1].toUpperCase() + a.slice(2));
        }
        return result;
      }
      console.log(secondCapitalize(["apple", "mango", "kiwi"]));
    </script>
