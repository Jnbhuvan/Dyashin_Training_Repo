    <script>
      function objKeySum(arrObj) {
        let result = {};

        for (let obj of arrObj) {
          for (let key in obj) {
            if (result[key]) {
              result[key] += obj[key];
            } else {
              result[key] = obj[key];
            }
          }
        }
        return result;
      }
      let obj = [
        {
          a: 10,
          b: 20,
          c: 30,
        },
        {
          d: 20,
          a: 10,
          c: 30,
        },
      ];

      console.log(objKeySum(obj));
    </script>
