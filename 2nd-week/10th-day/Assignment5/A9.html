    <script>
      function generatePrimeNo(start, end) {
        let prime = [];
        for (let i = start; i <= end; i++) {
          let isPrime = true;

          if (i < 2) {
            isPrime = false;
          }
          for (let j = 2; j < i; j++) {
            if (i % j === 0) {
              isPrime = false;
              break;
            }
          }
          if (isPrime) {
            prime.push(i);
          }
        }
        return prime;
      }
      console.log("generatePrimeNo(20,40)", generatePrimeNo(20, 40));
    </script>
