    <h4>
      2. WAP to remove the duplicates from the above array.
      <br />
      let arr = ['a','b','c','d','a','b']
      <br />
      o/p = [a,b,c,d]
    </h4>

    <script>
      function removeDuplicates(arr) {
        let t = [];
        for (let a of arr) {
          if (t.includes(a)) {
            continue;
          } else {
            t.push(a);
          }
        }
        return t;
      }
      console.log(removeDuplicates(["a", "b", "c", "d", "a", "b"]));
    </script>
