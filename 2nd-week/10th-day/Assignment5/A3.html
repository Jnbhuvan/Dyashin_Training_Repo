    <script>
      function getDuplicates(arr) {
        let t = [];
        let d = [];
        for (let a of arr) {
          if (t.includes(a)) {
            d.push(a);
          } else {
            t.push(a);
          }
        }
        return d;
      }
      console.log(
        "getDuplicates(['a','b','c','d','a','b'])",
        getDuplicates(["a", "b", "c", "d", "a", "b"]),
      );
