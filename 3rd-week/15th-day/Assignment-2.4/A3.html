<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spread Operator for object & Array</title>
  </head>
  <body>
    <h1>Spread operator object and array</h1>
    <h3>Assignment 2.4.3</h3>
    <h3>by BHUVAN J N</h3>
    <script>
      const user = {
        name: "Rahul",
        age: 25,
        skills: ["JavaScript", "HTML"],
      };

      const newSkills = ["CSS", "React"];

      // 1. Array Spread
      const allSkills = [...user.skills, ...newSkills];

      // 2. Object Spread
      const updatedUser = {
        ...user,
        age: 26,
        skills: allSkills,
      };

      console.log(updatedUser);
    </script>
  </body>
</html>
