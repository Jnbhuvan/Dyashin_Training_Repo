    <title>Duplicates removal</title>
  </head>
  <body>
    <h1>WAP to remove the duplicates from the array</h1>
    <h3>Assignment 2.4.2</h3>
    <h3>by BHUVAN JN</h3>
    <script>
      function removeDuplicates(arr) {
        return [...new Set(arr)];
      }
      console.log(removeDuplicates(["a", "b", "c", "d", "a", "b"]));
    </script>
  </body>
