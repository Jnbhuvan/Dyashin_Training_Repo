<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      }
      .parent {
        display: flex;
        flex-direction: row;
      }
      .left {
        height: 100vh;
        width: 50vw;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: larger;
        /* height: 50vh; */
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 200px;
      }
      .right {
        height: 100vh;
        width: 50vw;
        background-color: rgb(105, 226, 24);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: black;
        font-size: larger;
      }
      .t20 {
        /* margin-top; */
        height: 50vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 500px;
      }
      .PM {
        position: absolute;
        right: 20px;
        top: 10px;

      }
    </style>
  </head>

  <body>
    <div class="parent">
      <div class="left">05:48</div>
      <div class="right">
        <h1 class="PM">PM</h2>
        <!-- <br /> -->
        <p class="t20">20</p>
      </div>
    </div>


    <script>
       function updateTime() {
    const now = new Date();

    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const seconds = String(now.getSeconds()).padStart(2, "0");

    // AM / PM
    const ampm = hours >= 12 ? "PM" : "AM";

    // Convert 24-hour time to 12-hour time
    hours = hours % 12;
    hours = hours || 12;

    // Update HTML
    document.querySelector(".left").textContent =
      `${String(hours).padStart(2, "0")}:${minutes}`;

    document.querySelector(".PM").textContent = ampm;

    document.querySelector(".t20").textContent = seconds;
  }

  // Update immediately
  updateTime();

  // Update every second
  setInterval(updateTime, 1000);
    </script>
  </body>
</html>
