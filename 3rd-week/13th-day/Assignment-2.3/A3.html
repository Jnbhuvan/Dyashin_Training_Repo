<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sort without using builtin functions</title>
  </head>
  <body>
    <h1>Sorting without using Sort method</h1>
    <h3>Assignment 2.3.3</h3>
    <h3>BHUVAN JN</h3>
    <script>
      function sortArr(arr) {
        for (let i = 0; i < arr.length; i++) {
          for (let j = 0; j < arr.length - i - 1; j++) {
            if (arr[j + 1] < arr[j]) {
              let t = arr[j];
              arr[j] = arr[j + 1];
              arr[j + 1] = t;
            }
          }
        }
        return arr;
      }
      console.log(sortArr([22, 33, 11, 54, 8]));
    </script>
  </body>
</html>
