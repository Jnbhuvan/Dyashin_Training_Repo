  <body>
    <h1>Find the largest word in a sentence</h1>
    <h3>by BHUVAN JN</h3>

    <script>
      function longestWord(str) {
        let largest = "";
        let mx = 0;
        for (let s of str.split(" ")) {
          if (mx < s.length) {
            mx = s.length;
            largest = s;
          }
        }
        return largest;
      }
      console.log(longestWord("React makes frontend development simple"));
    </script>
  </body>
