  <body>
    <h1>Find sum of n natural numbers</h1>
    <h2>Assignment 2.2.12</h2>
    <h4>by BHUVAN JN</h4>
    <script>
      function findSumOfN(n) {
        let s = 0;
        for (let i = 0; i <= n; i++) {
          s += i;
        }
        return s;
      }
      console.log(findSumOfN(3));
    </script>
  </body>
