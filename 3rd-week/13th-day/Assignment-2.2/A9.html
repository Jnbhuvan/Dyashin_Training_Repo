    <title>Factorial</title>

  <body>
    <h1>Find Factorial of number</h1>
    <h2>Assignment 2.2.9</h2>
    <h3>by BHUVAN JN</h3>

    <script>
      function factorial(n) {
        return n <= 1 ? n : n * factorial(n - 1);
      }
      console.log(factorial(1));
    </script>
  </body>
