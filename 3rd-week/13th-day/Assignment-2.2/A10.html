  <body>
    <h1>Check if a number is an armstrong number or not?</h1>
    <h2>Assignment 2.2.10</h2>

    <h3>by BHUVAN JN</h3>

    <script>
      function checkArmStrong(num) {
        let sum = 0;

        for (let n of num.toString().split("")) {
          let t = parseInt(n);
          t = t ** 3;
          sum += t;
        }
        return sum === num;
      }

      console.log(checkArmStrong(153));
    </script>
  </body>
