    <title>Check Palindrom</title>

  <body>
    <h1></h1>
    <h1>Assignment 2.2.6</h1>
    <h3>Find and check if a number is a palindrome</h3>

    <h3>by BHUVAN JN</h3>

    <script>
      function palindrome(n) {
        return n.toString() === n.toString().split("").reverse().join("");
      }
      console.log(palindrome(1234521));
    </script>
  </body>
