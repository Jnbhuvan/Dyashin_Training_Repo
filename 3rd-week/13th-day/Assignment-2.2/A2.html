      Take three numbers as input. Use only if lese statements to find the
      largest number
    </h3>

    <script>
      function findLargest(a, b, c) {
        if (a > b && a > c) {
          return a;
        } else if (b > a && b > c) {
          return b;
        } else if (c > a && c > b) {
          return c;
        } else {
          return "All Are equal";
        }
      }

      console.log(findLargest(101, 204, 30));
    </script>
