<!doctype html>
<html lang="en">

    <title>Check ODD or not</title>

  <body>
    <h1>Assignment 2.2.1</h1>
    <h3>
      WAP to check if a given number is even or odd using only operators and
      if-else.
    </h3>

    <h3>by BHUVAN JN</h3>
    <script>
      function checkOddOrEven(n) {
        if (n % 2 == 0) {
          return "Even";
        } else {
          return "Odd";
        }
      }
      console.log(checkOddOrEven(5));
    </script>
  </body>
