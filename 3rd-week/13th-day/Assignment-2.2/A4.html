    <h3>CountDigits</h3>

    <h3>by BHUVAN JN</h3>

    <script>
      function countDigits(num) {
        let count = 0;
        num = Math.abs(num);
        while (num > 0) {
          count++;
          num = Math.floor(num / 10);
        }
        return count;
      }
      console.log(countDigits(12345876876875));
    </script>
