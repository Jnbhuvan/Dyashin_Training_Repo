<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call Apply bind practice</title>
  </head>
  <body>
    <h1>Call Apply bind practice</h1>
    <h1>Functional methods of JS</h1>
    <h3>By BHUVAN JN</h3>
    <script>
      let person = {
        name: "Jainag_Bhuvan",
      };
      function greet(age, place) {
        console.log(`Hello, ${this.name} ${age} ${place}`);
      }

      greet.call(person, 22, "Bengaluru");
      greet.apply(person, [23, "Mysore"]);

      let bind = greet.bind(person, 22, "bengaluru");
      bind();
    </script>
  </body>
</html>
