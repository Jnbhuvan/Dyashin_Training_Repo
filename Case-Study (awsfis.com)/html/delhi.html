<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Awfis - Shared & Co-Working Spaces</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <header class="sticky top-0 z-50 bg-black text-white">
      <div class="container mx-auto px-4 sm:px-5">
        <div class="flex h-16 items-center justify-between">
          <!-- =================================================
               LOGO
          ================================================== -->

          <a href="index.html" class="flex shrink-0 items-center">
            <img
              src="../awfis.svg"
              alt="Awfis logo"
              class="h-9 w-auto object-contain"
            />
          </a>

          <!-- =================================================
               DESKTOP NAVIGATION
          ================================================== -->

          <nav
            class="hidden md:ml-8 md:flex md:items-center md:border-l md:border-gray-600 md:pl-8"
          >
            <!-- =================================================
                 LOCATIONS DROPDOWN
            ================================================== -->

            <div class="group relative">
              <!-- Locations -->

              <a
                href="#"
                class="mr-6 flex items-center gap-1 text-sm font-semibold text-white transition hover:text-red-400"
              >
                LOCATIONS

                <!-- Arrow -->

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4 transition-transform duration-200 group-hover:rotate-180"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>
              </a>

              <!-- =================================================
                   LOCATION DROPDOWN
              ================================================== -->

              <div
                id="locations-dropdown"
                class="absolute left-0 top-full z-50 hidden w-[300px] overflow-hidden bg-white text-gray-500 shadow-2xl group-hover:block"
              >
                <!-- Delhi -->

                <a
                  href="delhi.html"
                  class="location-item block border-b border-gray-200 px-5 py-5 text-sm uppercase transition hover:bg-gray-50 hover:text-red-500"
                >
                  Coworking Space in Delhi
                </a>

                <!-- Gurgaon -->

                <a
                  href="gurgaon.html"
                  class="location-item block border-b border-gray-200 px-5 py-5 text-sm uppercase transition hover:bg-gray-50 hover:text-red-500"
                >
                  Coworking Space in Gurgaon
                </a>

                <!-- Noida -->

                <a
                  href="noida.html"
                  class="location-item block border-b border-gray-200 px-5 py-5 text-sm uppercase transition hover:bg-gray-50 hover:text-red-500"
                >
                  Coworking Space in Noida
                </a>

                <!-- Mumbai -->

                <a
                  href="mumbai.html"
                  class="location-item block border-b border-gray-200 px-5 py-5 text-sm uppercase transition hover:bg-gray-50 hover:text-red-500"
                >
                  Coworking Space in Mumbai
                </a>

                <!-- Bengaluru -->

                <a
                  href="bengaluru.html"
                  class="location-item block border-b border-gray-200 px-5 py-5 text-sm uppercase transition hover:bg-gray-50 hover:text-red-500"
                >
                  Coworking Space in Bengaluru
                </a>

                <!-- Hyderabad -->

                <a
                  href="hyderabad.html"
                  class="location-item block border-b border-gray-200 px-5 py-5 text-sm uppercase transition hover:bg-gray-50 hover:text-red-500"
                >
                  Coworking Space in Hyderabad
                </a>

                <!-- Kolkata -->

                <a
                  href="kolkata.html"
                  class="location-item block px-5 py-5 text-sm uppercase transition hover:bg-gray-50 hover:text-red-500"
                >
                  Coworking Space in Kolkata
                </a>
              </div>
            </div>

            <!-- =================================================
                 SOLUTIONS
            ================================================== -->

            <a
              href="#"
              class="mr-6 text-sm font-semibold text-white transition hover:text-red-400"
            >
              SOLUTIONS
            </a>

            <!-- =================================================
                 ENTERPRISE
            ================================================== -->

            <a
              href="#"
              class="mr-6 text-sm font-semibold text-white transition hover:text-red-400"
            >
              ENTERPRISE
            </a>

            <!-- =================================================
                 MEETING ROOMS
            ================================================== -->

            <a
              href="#"
              class="text-sm font-semibold text-white transition hover:text-red-400"
            >
              MEETING ROOMS
            </a>
          </nav>

          <!-- =================================================
               DESKTOP BUTTONS
          ================================================== -->

          <div class="hidden md:ml-auto md:flex md:items-center md:gap-3">
            <!-- Login -->

            <button
              id="navbar-login-button"
              type="button"
              class="inline-flex items-center rounded bg-gray-100 px-4 py-2 text-sm text-black transition hover:bg-gray-200"
            >
              Login

              <svg
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                class="ml-1 h-4 w-4"
                viewBox="0 0 24 24"
              >
                <path d="M5 12h14M12 5l7 7-7 7"></path>
              </svg>
            </button>

            <!-- Sign Up -->

            <button
              id="navbar-signup-button"
              type="button"
              class="inline-flex items-center rounded bg-gray-100 px-4 py-2 text-sm text-black transition hover:bg-gray-200"
            >
              Sign Up

              <svg
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                class="ml-1 h-4 w-4"
                viewBox="0 0 24 24"
              >
                <path d="M5 12h14M12 5l7 7-7 7"></path>
              </svg>
            </button>
          </div>

          <!-- =================================================
               MOBILE MENU BUTTON
          ================================================== -->

          <button
            id="mobile-menu-button"
            type="button"
            class="inline-flex items-center justify-center rounded-md p-2 text-gray-300 transition hover:bg-gray-800 hover:text-white md:hidden"
            aria-label="Open menu"
            aria-expanded="false"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="h-6 w-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
        </div>

        <!-- =================================================
             MOBILE MENU
        ================================================== -->

        <div
          id="mobile-menu"
          class="hidden border-t border-gray-800 pb-4 md:hidden"
        >
          <nav class="flex flex-col pt-3">
            <a href="#" class="rounded px-2 py-2 transition hover:bg-gray-800">
              Locations
            </a>

            <a href="#" class="rounded px-2 py-2 transition hover:bg-gray-800">
              Solutions
            </a>

            <a href="#" class="rounded px-2 py-2 transition hover:bg-gray-800">
              Enterprise
            </a>

            <a href="#" class="rounded px-2 py-2 transition hover:bg-gray-800">
              Meeting Rooms
            </a>

            <!-- Mobile Buttons -->

            <div class="mt-3 flex gap-2">
              <button
                id="mobile-login-button"
                type="button"
                class="flex-1 rounded bg-gray-100 px-3 py-2 text-sm text-black transition hover:bg-gray-200"
              >
                Login
              </button>

              <button
                id="mobile-signup-button"
                type="button"
                class="flex-1 rounded bg-gray-100 px-3 py-2 text-sm text-black transition hover:bg-gray-200"
              >
                Sign Up
              </button>
            </div>
          </nav>
        </div>
      </div>
    </header>
  </body>
</html>
